# SleepHook-Go configuration
# https://github.com/jtuki/sleephook-go

# Message displayed on the lock screen (optional, has default)
message: "不熬夜！早点休息！"

# lock_periods: list of time ranges to lock the screen.
#   start / end: "hh:mm" or "hh:mm:ss" format (24-hour).
#   Overnight ranges (start > end) must not exceed 1 hour.
#
# Changes take effect within 1 minute — no restart needed.

lock_periods:
  - start: "00:40"
    end:   "07:00"
