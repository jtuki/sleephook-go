# SleepHook-Go configuration
# https://github.com/jtuki/sleephook-go

# Message displayed on the lock screen (optional, has default)
message: "不熬夜！早点休息！"

# Text animation speed in pixels per frame (default: 2, range: 1-10)
speed: 2

# Overlay opacity (default: 240, range: 1-255, lower = more transparent)
opacity: 240

# Public IP region guard.
# enabled: true means run configured actions when successful provider
# responses do not include any country/region in allowed_countries.
# allowed_countries uses ISO 3166-1 alpha-2 country/region codes.
# providers defaults to all supported IP lookup sites; checks use them in
# round-robin order. Any successful allowed-country response passes the check;
# timeout or failed provider calls do not count as matches.
# actions defaults to disconnect for old configs. Use one powershell action to
# run a custom script instead, such as shutting down WSL without disabling networking.
network_check:
  enabled: true
  allowed_countries:
    - "SG"
  providers:
    - "ipinfo"
    - "ifconfig"
    - "ip-api"
    - "ipapi"
    - "ipwhois"
  actions:
    - type: "powershell"
      script: "wsl --shutdown"
  # At these times, show a prompt first. If the user confirms or does not
  # respond within 30 seconds, run actions and keep enforcing them for 120 minutes.
  # If the user chooses manual handling, this scheduled slot is not enforced.
  force_disconnect_times: []

# lock_periods: list of time ranges to lock the screen.
#   start / end: "hh:mm" or "hh:mm:ss" format (24-hour).
#   Overnight ranges (start > end) must not exceed 1 hour.
#
# Changes take effect within 1 minute — no restart needed.

lock_periods:
  - start: "00:40"
    end:   "07:00"
